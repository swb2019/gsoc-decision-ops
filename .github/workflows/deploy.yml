name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require the exact public release qualification record
        run: node scripts/check-release-gate.mjs

      - name: Verify semantic behavior and types before building
        run: npm test && npm run typecheck && npm run lint

      - name: Build core library
        run: npm run build --workspace=packages/core

      - name: Build static site
        run: npm run build --workspace=apps/web && node scripts/prepare-glasshouse-offline.mjs && node scripts/measure-release-budget.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /gsoc-decision-ops

      - name: Verify the built artifact
        run: npx playwright install --with-deps chromium && npx playwright test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
