name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_review_build:
        description: 'Publish for owner review while human qualification remains pending'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require the exact public release qualification record
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_review_build) }}
        run: node scripts/check-release-gate.mjs

      - name: Record explicitly requested review deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_review_build }}
        run: |
          echo '## Owner-requested review deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Human qualification remains pending; this deployment does not change the qualification record.' >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatched by: $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify semantic behavior and types before building
        run: npm test && npm run typecheck && npm run lint

      - name: Build core library
        run: npm run build --workspace=packages/core

      - name: Build static site
        run: npm run build --workspace=apps/web && node scripts/prepare-glasshouse-offline.mjs && node scripts/measure-release-budget.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /gsoc-decision-ops

      - name: Prepare browser audio on the Linux runner
        timeout-minutes: 10
        run: |
          # The Azure HTTP mirror can throttle large browser dependency downloads.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=hourglass_test_audio
          pactl set-default-sink hourglass_test_audio
          pactl info

      - name: Verify Chromium journeys
        run: npx playwright test --max-failures=1

      - name: Verify WebKit journeys
        run: npx playwright test --config playwright.engines.config.mjs --project webkit --max-failures=1

      - name: Verify Firefox journeys
        run: npx playwright test --config playwright.engines.config.mjs --project firefox --max-failures=1

      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-verification-evidence
          path: qa-output/
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
